spring.application.name=demandarecife
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.hibernate.ddl-auto=validate
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=jdbc:postgresql://localhost:5432/demandafacil?reWriteBatchedInserts=true
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Spring AI exige uma chave ao subir; valor falso por enquanto
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy}

# ==============================================================================
# VARIÁVEIS EXÓGENAS (RF08)
# ==============================================================================

# OpenWeather API 2.5
app.weather.openweather.api-key=${OPENWEATHER_API_KEY:}
app.weather.openweather.base-url=${OPENWEATHER_BASE_URL:https://api.openweathermap.org}
app.weather.cron=${WEATHER_CRON:0 0 2 * * ?}
app.weather.default-city=${DEFAULT_CITY:Recife}
app.weather.default-state=${DEFAULT_STATE:PE}

# Google Calendar API (Feriados)
app.holidays.google.api-key=${GOOGLE_CALENDAR_API_KEY:}
app.holidays.google.base-url=${GOOGLE_CALENDAR_BASE_URL:https://www.googleapis.com}
app.holidays.google.calendar-ids=${GOOGLE_CALENDAR_IDS:pt.brazilian#holiday@group.v.calendar.google.com}
app.holidays.cron=${HOLIDAYS_CRON:0 0 2 1 * ?}
app.holidays.backfill-enabled=${HOLIDAYS_BACKFILL_ENABLED:true}
